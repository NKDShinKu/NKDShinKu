version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # AGENTS §2：TypeScript 锁 5.9，勿升 7
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Actions 固定在 commit SHA（deploy.yml）：本项负责把 SHA 更新到新版本 tag
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
